<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1" />
<title>Documento sin t&iacute;tulo</title>
<style>
.invitacion-img{
width:100%;
height:auto;}
.contador-contenedor{position:relative;}

.tiempo {
position:absolute;
top:73%;
left:51%;
transform:translate(-50%,-50%);
color:#A65D6A;
font-size:4vw;
display: flex;
width:58vw;

}
.tiempo span{width:25%; text-align:center;}
.ubicacion-contenedor{position:relative;}
.boton-mapa{
width:30%;
max-width:300px;
position:absolute;
left:50%;
bottom:22%;
transform:translateX(-50%);
}
.trivia-contenedor {position:relative}
.boton-trivia{position:absolute;}
.boton-trivia.correcta{outline:4px solid #A65D6A;}
.boton-trivia.incorrecta{outline:4px solid #A65D6A;}
.boton-rosa {top:44%; left:30%; width: 10%;}
.boton-azul {top:44%; left:45%; width: 10%;}
.boton-morado {top:44%; left:60%; width: 10%;}
.boton-bailar {top:53%; left:30%; width: 10%;}
.boton-viajar {top:53%; left:45%; width: 10%;}
.boton-escuchar {top:53%; left:60%; width: 10%;}
.boton-pizza {top:62%; left:30%; width: 10%;}
.boton-sushi {top:62%; left:45%; width: 10%;}
.boton-hamburguesa {top:62%; left:60%; width: 10%;}
.boton-fotos {top:71%; left:30%; width: 10%;}
.boton-salir {top:71%; left:45%; width: 10%;}
.boton-dormir {top:71%; left:60%; width: 10%;}
#boton-resultados{top:75%; left: 35%; width: 35%;}

#resultado-trivia{
position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:80%;z-index:100;}
#imagen-resultado{width:100%;height:auto;display:block;}

.confirmacion-contenedor{position:relative;}
.boton-confirmar {
position: absolute;
left: 50%;
bottom: 11%;
transform: translateX(-50%);
width: 35%;
max-width: 400px;
cursor: pointer;
}
#portada-inicio {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 9999;
    background: white;
    overflow-y: auto;
}

#portada-inicio .portada-img {
    display: block;
    width: 100%;
    height: auto;
}

#boton-iniciar {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translateX(-50%);
    width: 80%;
    max-width: 600px;
    cursor: pointer;
}
</style>
</head>

<body>
<div id="portada-inicio">
    <img class="portada-img" src="img/sobre.jpeg" alt="Invitación">
    <img id="boton-iniciar" src="img/11688.png" alt="Iniciar invitación">
</div>

<img class="invitacion-img" src="img/invita.jpeg" alt="invitacion" />

<div class="contador-contenedor">
<img class="invitacion-img" src="img/contador.jpeg" alt="cuenta regresiva" />
<div class="tiempo">
<span class="dias">99</span>
<span class="horas">00</span>
<span class="minutos">00</span>
<span class="segundos">00</span>



</div>
</div>

<!--PAGINA DE UBICACION-->
<div class="ubicacion-contenedor">
<img class="invitacion-img" src="img/ubicacion.jpeg" alt="ubicacion del evento" />
<a href="https://maps.app.goo.gl/5ZTXjpxfgF73mJpo7" target="_blank">
<img class="boton-mapa" src="img/mapa.png" alt = "ver en el mapa" />
</a>
</div>

<!--pagina dress-->
<img class="invitacion-img" src="img/dresscode.jpeg" alt="dresscode" />

<div class= "trivia-contenedor">
<img class="invitacion-img" src="img/trivia.jpeg" alt="trivia" />
<img class="boton-trivia boton-rosa" src = "img/rosa.png" alt= "rosa" data-pregunta="1" data-respuesta="rosa" />
<img class= "boton-trivia boton-azul" src= "img/azul.png" alt="azul" data-pregunta="1" data-respuesta="azul" />
<img class= "boton-trivia boton-morado" src= "img/morado.png" alt="morado" data-pregunta="1" data-respuesta="morado" />
<img class= "boton-trivia boton-bailar" src= "img/bailar.png" alt="bailar" data-pregunta="2" data-respuesta="bailar" />
<img class= "boton-trivia boton-viajar" src= "img/viajar.png" alt="viajar" data-pregunta="2" data-respuesta="viajar" />
<img class= "boton-trivia boton-escuchar" src= "img/escuchar.png" alt="escuchar" data-pregunta="2" data-respuesta="escuchar" />
<img class= "boton-trivia boton-pizza" src= "img/pizza.png" alt="pizza" data-pregunta="3" data-respuesta="pizza" />
<img class= "boton-trivia boton-sushi" src= "img/sushi.png" alt="sushi" data-pregunta="3" data-respuesta="sushi" />
<img class= "boton-trivia boton-hamburguesa" src= "img/hamburguesa.png" alt="hamburguesa" data-pregunta="3" data-respuesta="hamburguesa" />
<img class= "boton-trivia boton-fotos" src= "img/fotos.png" alt="fotos" data-pregunta="4" data-respuesta="fotos" />
<img class= "boton-trivia boton-salir" src= "img/salir.png" alt="salir" data-pregunta="4" data-respuesta="salir" />
<img class= "boton-trivia boton-dormir" src= "img/dormir.png" alt="dormir" data-pregunta="4" data-respuesta="dormir" />
<img class= "boton-trivia" id="boton-resultados" src= "img/resultados.png" alt="ver resultados"/> 
<div id="resultado-trivia" style="display:none;">
<img id="imagen-resultado" src="" alt="Resultado de la trivia" />
</div>

</div>

<!-- PAGINA CONFIRMACION -->
<div class="confirmacion-contenedor">
    <img class="invitacion-img" src="img/asistencia.png" alt="Confirmación de asistencia">

    <a href="https://wa.me/573146106418?text=Hola%2C%20confirmo%20mi%20asistencia." target="_blank">
        <img class="boton-confirmar" src="img/confirmar.png" alt="Confirmar asistencia">
    </a>
</div>

              

<script>
const fechaEvento=new Date ("2026-11-21T19:00:00-05:00");
function actualizarContador(){
const ahora = new Date ();
const diferencia = fechaEvento - ahora;
const dias = Math.floor(diferencia / (1000 * 60 * 60 * 24));
const horas = Math.floor((diferencia/(1000 * 60 * 60))% 24);
const minutos = Math.floor((diferencia/(1000 * 60 ))% 60);
const segundos = Math.floor((diferencia/(1000 ))% 60);
document.querySelector(".segundos").textContent = segundos;
document.querySelector(".minutos").textContent = minutos;
document.querySelector(".horas").textContent = horas;
document.querySelector(".dias").textContent = dias;
}
actualizarContador();
setInterval(actualizarContador, 1000);

const opciones  = document.querySelectorAll('.boton-trivia[data-pregunta]');
const botonResultados = document.getElementById ("boton-resultados");
const correctas = {
"1":"morado",
"2":"viajar", 
"3":"pizza", 
"4":"salir"
};

opciones.forEach(opcion => {
    opcion.addEventListener("click", () => {
        const pregunta = opcion.dataset.pregunta;
        const respuesta = opcion.dataset.respuesta;
        
		opciones.forEach(otraOpcion => {
    if (otraOpcion.dataset.pregunta === pregunta) {
        otraOpcion.classList.remove("correcta", "incorrecta");
    }
});
		
        if (respuesta == correctas[pregunta]) {
            opcion.classList.add("correcta");
        } else {
            opcion.classList.add("incorrecta");
        }
    });
});

botonResultados.addEventListener("click", () => { 
const respondidas=new Set();

    let puntaje = 0;
    
    // 1. Solo sumamos si la opción seleccionada tiene la clase "correcta"
    opciones.forEach(opcion => {
	if(opcion.classList.contains("correcta")||
	opcion.classList.contains("incorrecta")) {
	respondidas.add(opcion.dataset.pregunta);}
	
        if (opcion.classList.contains("correcta")) {
            puntaje++;
        }
    });
	
	if(respondidas.size<4) {return;}
    
    // 2. El alert debe ir DENTRO del evento click para mostrarse al presionar el botón
const resultadoTrivia = document.getElementById("resultado-trivia");
const imagenResultado = document.getElementById("imagen-resultado");

if (puntaje <= 1) {
    imagenResultado.src = "img/resultado1.png";
} else if (puntaje <= 3) {
    imagenResultado.src = "img/resultado3.png";
} else {
    imagenResultado.src = "img/resultado4.png";
}

resultadoTrivia.style.display = "block";


}); // 3. Se corrigieron las llaves y paréntesis de cierre sobrantes
document.getElementById('boton-iniciar').addEventListener('click', function () {
    const musica = document.getElementById('musica-fondo');
    musica.play();
    document.getElementById('portada-inicio').remove();
    window.scrollTo(0, 0);
});
</script>

<audio id="musica-fondo" autoplay loop>
    <source src="img/cancion.mp3" type="audio/mpeg">
</audio>

</body>
</html>
